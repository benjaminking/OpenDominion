<div class="shared">
  <div class="trash-icon" (click)="toggleTrashVisibility()">
    <img src="images/trash.jpg" />
  </div>
  <card-dialog title="Trash" [cards]="trash()" [name]="trashViewName" [grouped]="true" [sorted]="true"></card-dialog>
  <card-dialog
    title=""
    [cards]="miscellaneousCards()"
    [name]="miscellaneousViewName"
    [grouped]="true"
    [sorted]="true"
  ></card-dialog>
</div>
