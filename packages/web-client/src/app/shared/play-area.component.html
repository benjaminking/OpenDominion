<div id="in-play-area">
  @for (playerName of playerNames(); track playerName) {
    @if (playerName === currentPlayerName()) {
      <div class="player-in-play-area">
        <div class="in-play-cards">
          <card-display [cards]="playerInPlays().get(playerName)!()" [grouped]="true" [staggered]="true"></card-display>
        </div>
      </div>
    }
  }
</div>
