<div
  class="standard-card-group"
  [ngClass]="{
    selectable: isSelectable(),
    'select-bottomdeck': isSelectionType(CardSelectionPurpose.BOTTOMDECK),
    'select-discard': isSelectionType(CardSelectionPurpose.DISCARD),
    'select-draw': isSelectionType(CardSelectionPurpose.DRAW),
    'select-exile': isSelectionType(CardSelectionPurpose.EXILE),
    'select-gain': isSelectionType(CardSelectionPurpose.GAIN),
    'select-other': isSelectionType(CardSelectionPurpose.OTHER),
    'select-play': isSelectionType(CardSelectionPurpose.PLAY),
    'select-play-alt': isSelectionType(CardSelectionPurpose.PLAY_ALT),
    'select-topdeck': isSelectionType(CardSelectionPurpose.TOPDECK),
    'select-trash': isSelectionType(CardSelectionPurpose.TRASH),
  }"
  (click)="processClick()"
>
  <!-- <img class="card-group-main-img" src="/images/{{ fileName() }}.jpg" /> -->
  <div class="card">
    <card [metadata]="cards()[0]"></card>
  </div>
  <div class="card-counts">
    @if (count() > 0) {
      <div class="card-count">{{ count() }}</div>
    }
    @if (selectedcount() > 0 && isMultiSelection()) {
      <div class="selected-card-count">{{ selectedcount() }}</div>
    }
  </div>
</div>
