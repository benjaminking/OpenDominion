<div
  class="standard-card-group"
  [ngClass]="{
    selectable: isSelectable(),
    'select-bottomdeck': isSelectionType('bottomdeck'),
    'select-discard': isSelectionType('discard'),
    'select-draw': isSelectionType('draw'),
    'select-exile': isSelectionType('exile'),
    'select-gain': isSelectionType('gain'),
    'select-other': isSelectionType('other'),
    'select-play': isSelectionType('play'),
    'select-play-alt': isSelectionType('play-alternative'),
    'select-topdeck': isSelectionType('topdeck'),
    'select-trash': isSelectionType('trash'),
  }"
  (click)="processClick()"
>
  <!-- <img class="card-group-main-img" src="/images/{{ fileName() }}.jpg" /> -->
  <div class="card">
    <card [metadata]="cards()[0]"></card>
  </div>
  <div class="card-counts">
    @if (count() > 0) {
      <div class="card-count">{{ count() }}</div>
    }
    @if (selectedcount() > 0 && isMultiSelection()) {
      <div class="selected-card-count">{{ selectedcount() }}</div>
    }
  </div>
</div>
