<div class="player-line-container me">
  <div class="player-line">
    <div class="deck-and-discard display-stat">
      <div class="deck">
        <img src="/images/card_back.png" />
        <div class="card-count">{{ deckSize() }}</div>
      </div>
      <!-- TODO: when we're choosing a card from the discard, this should act like a toggle
           in case the user closes the dialog-->
      <div class="discard">
        @if (topDiscard(); as topCardOfDiscard) {
          <img src="/images/{{ topCardOfDiscard.name }}.jpg" />
        } @else {
          <div class="empty-discard"></div>
        }
      </div>
    </div>
    <div class="reveal-limbo-toggle card-area-toggle display-stat" (click)="toggleRevealedCardsViewer()">
      Revealed Cards
      <div class="pile-count">{{ limbo().length }}</div>
    </div>
    <div class="set-aside-toggle card-area-toggle display-stat" (click)="toggleSetAsideCardsViewer()">
      Set Aside Cards
      <div class="pile-count">{{ setAside().length }}</div>
    </div>
    <div class="rotated-name-holder display-stat">
      <div class="rotated-name">{{ name() }}</div>
    </div>
  </div>
</div>
<card-dialog title="Revealed Cards" [cards]="limbo()" [name]="revealedCardsViewName"></card-dialog>
<card-dialog
  title="Set-aside Cards"
  [cards]="setAside()"
  [name]="setAsideCardsViewName"
  [grouped]="true"
  [sorted]="true"
></card-dialog>
<card-dialog title="Discard" [cards]="discard()" [name]="discardViewName"></card-dialog>
